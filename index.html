<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA PINTA · Reserva tu cita</title>
<meta name="description" content="Reserva tu cita en LA PINTA Barbería en segundos.">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f; --card: #1a1a1a; --card2: #222; --line: #2e2e2e;
    --txt: #f2f2f2; --sub: #a3a3a3; --acc: #e0b04a; --acc-txt: #161208;
    --ok: #2fbf71; --err: #ff6b6b; --wa: #25d366;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 Inter, system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }

  header { padding: 22px 16px 8px; text-align: center; background:
    repeating-linear-gradient(135deg, #b3262d 0 10px, #f2f2f2 10px 20px, #1f4fa8 20px 30px, #f2f2f2 30px 40px) top / 100% 6px no-repeat; }
  .logo { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 52px; letter-spacing: 3px; line-height: 1; margin-top: 12px; }
  .logo span { color: var(--acc); }
  .lema { color: var(--sub); font-size: 13px; margin-top: 2px; }

  nav { position: sticky; top: 0; z-index: 5; background: rgba(15,15,15,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; gap: 6px; padding: 10px 16px; }
  nav button { flex: 1; border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; color: var(--sub); font-weight: 600; cursor: pointer; }
  nav button.on { background: var(--acc); color: var(--acc-txt); }

  h2 { font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 26px; margin: 22px 0 10px; }
  h2 small { font-family: Inter, sans-serif; font-size: 13px; color: var(--sub); letter-spacing: 0; margin-left: 6px; }
  .grid { display: grid; gap: 8px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
         background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .opt b { font-weight: 600; }
  .opt .meta { color: var(--sub); font-size: 13px; white-space: nowrap; }
  .opt.on { border-color: var(--acc); background: #241e10; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-width: 64px; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; cursor: pointer; }
  .chip small { display: block; color: var(--sub); font-size: 11px; text-transform: uppercase; }
  .chip b { font-size: 18px; }
  .chip.on { border-color: var(--acc); background: #241e10; }
  .chip:disabled { opacity: .35; cursor: default; }
  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .horas .chip { min-width: 0; padding: 10px 4px; font-weight: 600; }

  label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 5px; }
  input { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; }
  input:focus { border-color: var(--acc); }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 16px; cursor: pointer;
         background: var(--acc); color: var(--acc-txt); margin-top: 16px; text-align: center; text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sec { background: var(--card2); color: var(--txt); }
  .btn.wa { background: var(--wa); color: #06210f; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .resumen div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .resumen div:last-child { border: 0; }
  .resumen span { color: var(--sub); }
  .ok { border-color: #1f6b43; background: #10261a; }
  .err { color: var(--err); font-size: 14px; margin-top: 10px; }
  .muted { color: var(--sub); font-size: 13px; }
  .codigo { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 40px; letter-spacing: 2px; color: var(--acc); line-height: 1.1; }
  .aviso { border: 1px solid #5c4a1c; background: #1e180b; color: #e8d6a8; border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-top: 22px; }
  .plan h3 { margin: 0; font-size: 18px; }
  .plan .precio { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 34px; color: var(--acc); line-height: 1; margin: 6px 0; }
  .plan ul { margin: 8px 0 0; padding-left: 18px; color: var(--sub); }
  .info { color: var(--sub); font-size: 13px; text-align: center; margin-top: 28px; }
  .info a { color: var(--sub); }
  .soporte { position: fixed; right: 16px; bottom: 18px; z-index: 6; background: var(--wa); color: #06210f; border-radius: 30px; padding: 12px 16px; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .cargando { color: var(--sub); padding: 30px 0; text-align: center; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .vista { animation: entra .18s ease-out; } @keyframes entra { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<header>
  <div class="logo">LA <span>PINTA</span></div>
  <div class="lema" id="lema">Barbería</div>
</header>
<nav><div class="wrap">
  <button data-tab="reservar" class="on">Reservar</button>
  <button data-tab="micita">Mi cita</button>
  <button data-tab="planes">Planes</button>
</div></nav>

<main class="wrap">
  <section id="v-reservar" class="vista"><div class="cargando">Cargando…</div></section>
  <section id="v-micita" class="vista hidden"></section>
  <section id="v-planes" class="vista hidden"></section>

  <div class="aviso"><b>Aviso:</b> LA PINTA nunca te pide pagos por adelantado ni datos de tu banco. Pagas en la barbería. Si alguien te escribe desde otro número pidiendo dinero, no es nosotros.</div>
  <div class="info" id="info"></div>
</main>
<a class="soporte hidden" id="soporte" target="_blank" rel="noopener">WhatsApp</a>

<script>
/* Dirección de la API (Apps Script → Implementar → Aplicación web). */
const API = 'https://script.google.com/macros/s/AKfycbww7Rb-iJORoP9w7244ZZRUBUTDEQHgnBvj28PEhrn79vUb3l5BlB_zzW3M9bJoP4dJyQ/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = v => '$' + Math.round(v || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const leerLS = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

let D = null;               // datos del negocio
const R = { servicio: null, barbero: '*', fecha: null, hora: null };

/* Llamadas a la API con reintentos (tras publicar, Google responde error unos minutos). */
async function api(params, post) {
  let ultimo;
  for (let i = 0; i < 5; i++) {
    try {
      const r = post
        ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(params) })
        : await fetch(API + '?' + new URLSearchParams(params));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j.ok) { const e = new Error(j.error || 'Error'); e.final = true; throw e; }
      return j;
    } catch (e) {
      if (e.final) throw e;
      ultimo = e;
      await new Promise(res => setTimeout(res, 800 * (i + 1)));
    }
  }
  throw new Error('No pudimos conectar. Revisa tu internet e inténtalo de nuevo.');
}

const waLink = (tel, txt) => 'https://wa.me/' + tel + '?text=' + encodeURIComponent(txt);
function fechaISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function deISO(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function cerrado(h) { return !/^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/.test(String(h).trim()); }
function hora12(h) { const [a, b] = h.split(':').map(Number); return (a % 12 || 12) + ':' + String(b).padStart(2, '0') + (a < 12 ? ' a. m.' : ' p. m.'); }

/* ---------- Pestañas ---------- */
function tab(nombre) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === nombre));
  ['reservar', 'micita', 'planes'].forEach(t => $('#v-' + t).classList.toggle('hidden', t !== nombre));
  if (nombre === 'micita' && !$('#v-micita').innerHTML) vistaMiCita();
  if (nombre === 'planes') vistaPlanes();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));

/* ---------- Reservar ---------- */
function vistaReservar() {
  const v = $('#v-reservar');
  const serv = D.servicios.find(s => s.id === R.servicio);
  let html = '<h2>1 · Servicio</h2><div class="grid">' + D.servicios.map(s =>
    `<button class="opt ${s.id === R.servicio ? 'on' : ''}" data-s="${esc(s.id)}"><b>${esc(s.nombre)}</b><span class="meta">${pesos(s.precio)} · ${s.dur} min</span></button>`).join('') + '</div>';
  if (serv) {
    html += '<h2>2 · Barbero</h2><div class="chips">' +
      [{ id: '*', nombre: 'Cualquiera' }].concat(D.barberos).map(b =>
        `<button class="chip ${b.id === R.barbero ? 'on' : ''}" data-b="${esc(b.id)}"><b style="font-size:15px">${esc(b.nombre.split(' ')[0])}</b></button>`).join('') + '</div>';
    html += '<h2>3 · Día</h2><div class="chips">';
    const hoy = deISO(D.hoy);
    for (let i = 0; i <= D.dias; i++) {
      const d = new Date(hoy); d.setDate(d.getDate() + i);
      const iso = fechaISO(d);
      const off = cerrado(D.horario[d.getDay()]);
      html += `<button class="chip ${iso === R.fecha ? 'on' : ''}" data-f="${iso}" ${off ? 'disabled' : ''}><small>${i === 0 ? 'Hoy' : i === 1 ? 'Mañana' : DIAS[d.getDay()]}</small><b>${d.getDate()}</b><small>${MESES[d.getMonth()]}</small></button>`;
    }
    html += '</div>';
  }
  if (serv && R.fecha) html += '<h2>4 · Hora</h2><div id="horas" class="cargando">Buscando horarios libres…</div>';
  if (serv && R.fecha && R.hora) {
    const nb = R.barbero === '*' ? 'El que esté libre' : D.barberos.find(b => b.id === R.barbero).nombre;
    const yo = leerLS('cliente') || {};
    html += `<h2>5 · Tus datos</h2>
      <div class="card resumen">
        <div><span>Servicio</span><b>${esc(serv.nombre)}</b></div>
        <div><span>Barbero</span><b>${esc(nb)}</b></div>
        <div><span>Cuándo</span><b>${esc(fechaLarga(R.fecha))}, ${hora12(R.hora)}</b></div>
        <div><span>Precio</span><b>${pesos(serv.precio)}</b></div>
      </div>
      <label for="nombre">Nombre</label><input id="nombre" autocomplete="name" value="${esc(yo.nombre || '')}" placeholder="Tu nombre">
      <label for="tel">WhatsApp</label><input id="tel" type="tel" inputmode="numeric" autocomplete="tel" value="${esc(yo.tel || '')}" placeholder="300 123 4567">
      <div id="err" class="err"></div>
      <button class="btn" id="confirmar">Confirmar reserva</button>
      <p class="muted">Pagas en la barbería. ${esc(D.advertencia)}</p>`;
  }
  v.innerHTML = html;
  v.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { R.servicio = b.dataset.s; R.hora = null; vistaReservar(); });
  v.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { R.barbero = b.dataset.b; R.hora = null; vistaReservar(); });
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { R.fecha = b.dataset.f; R.hora = null; vistaReservar(); });
  if (serv && R.fecha) cargarHoras();
  if ($('#confirmar')) $('#confirmar').onclick = confirmar;
}

function fechaLarga(iso) {
  const d = deISO(iso);
  const n = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][d.getDay()];
  return n + ' ' + d.getDate() + ' de ' + ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'][d.getMonth()];
}

let pedidoHoras = 0;
async function cargarHoras() {
  const n = ++pedidoHoras;
  const caja = $('#horas');
  try {
    const r = await api({ a: 'libres', fecha: R.fecha, barbero: R.barbero, servicio: R.servicio });
    if (n !== pedidoHoras || !$('#horas')) return;
    if (!r.libres.length) { caja.className = 'muted'; caja.textContent = 'No quedan horarios libres ese día. Prueba otro día u otro barbero.'; return; }
    caja.className = 'horas';
    caja.innerHTML = r.libres.map(s => `<button class="chip ${s.hora === R.hora ? 'on' : ''}" data-h="${s.hora}">${hora12(s.hora).replace(' ', '&nbsp;')}</button>`).join('');
    caja.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
      R.hora = b.dataset.h; vistaReservar();
      setTimeout(() => { const el = $('#nombre'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
    });
  } catch (e) {
    if (n === pedidoHoras && $('#horas')) { caja.className = 'err'; caja.textContent = e.message; }
  }
}

async function confirmar() {
  const nombre = $('#nombre').value.trim(), tel = $('#tel').value.replace(/\D/g, '');
  if (nombre.length < 2) return ($('#err').textContent = 'Escribe tu nombre.');
  if (tel.length < 10) return ($('#err').textContent = 'Escribe tu número de WhatsApp (10 dígitos).');
  const btn = $('#confirmar'); btn.disabled = true; btn.textContent = 'Reservando…'; $('#err').textContent = '';
  try {
    const r = await api({ a: 'reservar', nombre, tel, servicio: R.servicio, barbero: R.barbero, fecha: R.fecha, hora: R.hora }, true);
    guardar('cliente', { nombre, tel });
    guardar('ultimaCita', { cita: r.cita, t: r.tel });
    const enlace = location.origin + location.pathname + '?cita=' + r.cita + '&t=' + r.tel;
    const msg = 'Hola, reservé en ' + D.negocio + ': ' + r.servicio + ' el ' + r.fechaTxt + ' a las ' + r.hora12 + ' con ' + r.barbero + '. Código ' + r.cita + '.';
    $('#v-reservar').innerHTML = `
      <h2>¡Reserva recibida!</h2>
      <div class="card ok">
        <div class="muted">Tu código</div><div class="codigo">${esc(r.cita)}</div>
        <div class="resumen" style="margin-top:8px">
          <div><span>Servicio</span><b>${esc(r.servicio)}</b></div>
          <div><span>Barbero</span><b>${esc(r.barbero)}</b></div>
          <div><span>Cuándo</span><b>${esc(r.fechaTxt)}, ${esc(r.hora12)}</b></div>
          <div><span>Precio</span><b>${pesos(r.precio)}</b></div>
        </div>
      </div>
      <p class="muted">Te escribiremos por WhatsApp para confirmarla. Guarda este enlace para consultar o cancelar tu cita:</p>
      <div class="card" style="word-break:break-all;font-size:13px">${esc(enlace)}</div>
      ${D.whatsapp ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(D.whatsapp, msg))}">Avisar por WhatsApp</a>` : ''}
      <button class="btn sec" id="otra">Hacer otra reserva</button>`;
    $('#otra').onclick = () => { R.servicio = null; R.barbero = '*'; R.fecha = null; R.hora = null; vistaReservar(); };
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Confirmar reserva';
    $('#err').textContent = e.message;
    if (/ocupar/.test(e.message)) { R.hora = null; cargarHoras(); }
  }
}

/* ---------- Mi cita ---------- */
function vistaMiCita(cita, t) {
  const ult = leerLS('ultimaCita') || {};
  cita = cita || ult.cita || ''; t = t || ult.t || '';
  $('#v-micita').innerHTML = `
    <h2>Consulta tu cita</h2>
    <label for="mc-cita">Código de la cita</label><input id="mc-cita" value="${esc(cita)}" placeholder="CT00012" autocapitalize="characters">
    <label for="mc-tel">WhatsApp con el que reservaste</label><input id="mc-tel" type="tel" inputmode="numeric" value="${esc(t)}" placeholder="300 123 4567">
    <div id="mc-err" class="err"></div>
    <button class="btn" id="mc-buscar">Consultar</button>
    <div id="mc-res"></div>`;
  $('#mc-buscar').onclick = consultar;
  if (cita && t) consultar();
}

async function consultar() {
  const cita = $('#mc-cita').value.trim(), t = $('#mc-tel').value.replace(/\D/g, '');
  if (!cita || t.length < 10) return ($('#mc-err').textContent = 'Escribe el código y tu WhatsApp.');
  $('#mc-err').textContent = ''; $('#mc-res').innerHTML = '<div class="cargando">Buscando…</div>';
  try {
    const r = await api({ a: 'micita', cita, t });
    $('#mc-res').innerHTML = `
      <div class="card ${r.cancelable ? 'ok' : ''}">
        <div class="muted">Hola ${esc(r.cliente)}, tu cita <b>${esc(r.cita)}</b> está:</div>
        <div class="codigo" style="font-size:30px">${esc(r.estado)}</div>
        <div class="resumen">
          <div><span>Servicio</span><b>${esc(r.servicio)}</b></div>
          <div><span>Barbero</span><b>${esc(r.barbero)}</b></div>
          <div><span>Cuándo</span><b>${esc(r.fechaTxt)}, ${esc(r.hora12)}</b></div>
        </div>
      </div>
      ${r.membresia ? `<div class="card"><b>${esc(r.membresia.plan)}</b><div class="muted">Te quedan ${r.membresia.restantes} servicios · vence el ${esc(r.membresia.vence)}</div></div>` : ''}
      ${r.cancelable ? '<button class="btn sec" id="mc-cancelar">Cancelar esta cita</button>' : ''}`;
    if ($('#mc-cancelar')) $('#mc-cancelar').onclick = async () => {
      if (!confirm('¿Seguro que quieres cancelar la cita ' + r.cita + '?')) return;
      const b = $('#mc-cancelar'); b.disabled = true; b.textContent = 'Cancelando…';
      try { await api({ a: 'cancelar', cita, t }, true); consultar(); }
      catch (e) { b.disabled = false; b.textContent = 'Cancelar esta cita'; $('#mc-err').textContent = e.message; }
    };
  } catch (e) { $('#mc-res').innerHTML = ''; $('#mc-err').textContent = e.message; }
}

/* ---------- Planes ---------- */
function vistaPlanes() {
  $('#v-planes').innerHTML = '<h2>Planes mensuales <small>pagas una vez, vienes varias</small></h2>' + D.planes.map(p => `
    <div class="card plan">
      <h3>${esc(p.nombre)}</h3>
      <div class="precio">${pesos(p.precio)}</div>
      <div class="muted">${p.usos} servicios · válido ${p.dias} días</div>
      <ul>${p.incluye.map(s => '<li>' + esc(s) + '</li>').join('')}</ul>
      ${D.whatsapp ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(D.whatsapp, 'Hola, quiero el ' + p.nombre + ' (' + pesos(p.precio) + ').'))}">Lo quiero</a>` : ''}
    </div>`).join('') + '<p class="muted">El plan se activa en la barbería al pagar.</p>';
}

/* ---------- Inicio ---------- */
function pintarDatos() {
  document.title = D.negocio + ' · Reserva tu cita';
  $('#lema').textContent = 'Barbería' + (D.ciudad ? ' · ' + D.ciudad : '');
  const horas = D.horario.map((h, i) => DIAS[i] + ' ' + (cerrado(h) ? 'cerrado' : h.replace('-', '–'))).slice(1).concat(DIAS[0] + ' ' + (cerrado(D.horario[0]) ? 'cerrado' : D.horario[0].replace('-', '–')));
  $('#info').innerHTML = esc(D.direccion) + (D.ciudad ? ', ' + esc(D.ciudad) : '') + '<br>' + esc(horas.join(' · '));
  if (D.whatsapp) { const s = $('#soporte'); s.href = waLink(D.whatsapp, 'Hola, tengo una pregunta.'); s.classList.remove('hidden'); }
}

(async function iniciar() {
  const q = new URLSearchParams(location.search);
  const previo = leerLS('datos');
  if (previo) { D = previo; D.hoy = fechaISO(new Date()); pintarDatos(); vistaReservar(); }
  try {
    const r = await api({ a: 'datos' });
    D = r; guardar('datos', r); pintarDatos();
    if (!q.get('cita')) vistaReservar();
  } catch (e) {
    if (!previo) $('#v-reservar').innerHTML = '<div class="err">' + esc(e.message) + '</div><button class="btn sec" onclick="location.reload()">Reintentar</button>';
  }
  if (q.get('cita') && D) { tab('micita'); vistaMiCita(q.get('cita'), q.get('t')); }
})();
</script>
</body>
</html>
