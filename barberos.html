<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA PINTA · Portal de barberos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #010101; --card: #161616; --card2: #222; --line: #2e2e2e; --txt: #f2f2f2; --sub: #a3a3a3;
          --acc: #e0b04a; --acc-txt: #161208; --ok: #2fbf71; --err: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 Inter, system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 60px; }
  header { text-align: center; padding: 14px 16px 4px; background:
    repeating-linear-gradient(135deg, #b3262d 0 10px, #f2f2f2 10px 20px, #1f4fa8 20px 30px, #f2f2f2 30px 40px) top / 100% 6px no-repeat; }
  header img { width: 110px; height: auto; margin-top: 8px;
    -webkit-mask-image: radial-gradient(circle closest-side, #000 92%, transparent 100%); mask-image: radial-gradient(circle closest-side, #000 92%, transparent 100%); }
  .titulo { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 26px; letter-spacing: 1px; }
  h2 { font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 24px; margin: 20px 0 8px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 5px; }
  input, select { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 12px; outline: none; }
  input:focus, select:focus { border-color: var(--acc); }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; cursor: pointer;
         background: var(--acc); color: var(--acc-txt); margin-top: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sec { background: var(--card2); color: var(--txt); }
  .btn.mini { display: inline-block; width: auto; padding: 9px 12px; font-size: 14px; margin: 0; }
  .fila { display: flex; gap: 8px; align-items: center; }
  .fila > * { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 10px; }
  .muted { color: var(--sub); font-size: 13px; }
  .err { color: var(--err); font-size: 14px; margin-top: 10px; }
  .okmsg { color: var(--ok); font-size: 14px; margin-top: 10px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .link { background: none; border: 0; color: var(--sub); text-decoration: underline; cursor: pointer; padding: 6px; }
  .dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .dias::-webkit-scrollbar { display: none; }
  .dia { min-width: 0; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 2px; cursor: pointer; }
  .dia small { display: block; color: var(--sub); font-size: 11px; text-transform: uppercase; }
  .dia b { font-size: 18px; display: block; }
  .dia i { display: block; font-style: normal; font-size: 10px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dia.on { border-color: var(--acc); background: #241e10; }
  .dia.cerrado { opacity: .4; }
  .estado-ok { color: var(--ok); } .estado-no { color: var(--err); } .estado-cerr { color: var(--sub); }
  .bloque { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; margin-top: 8px; }
  .bloque span { color: var(--sub); }
  .x { background: var(--card2); border: 0; border-radius: 10px; width: 42px; height: 42px; font-size: 18px; cursor: pointer; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .cita { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .cita:last-child { border: 0; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tabs button { flex: 1; border: 0; background: var(--card); padding: 10px; border-radius: 10px; color: var(--sub); font-weight: 600; cursor: pointer; }
  .tabs button.on { background: var(--acc); color: var(--acc-txt); }
  .perfil-foto { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .foto-grande { width: 96px; height: 96px; border-radius: 50%; background: #2a2a2a center / cover no-repeat; border: 2px solid var(--acc);
                 display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', Impact, sans-serif; font-size: 42px; color: var(--acc); }
  .serv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; margin: 0; border-bottom: 1px dashed var(--line); color: var(--txt); font-size: 14px; cursor: pointer; }
  .serv:last-child { border: 0; }
  .serv input { width: 22px; height: 22px; flex: 0 0 22px; accent-color: var(--acc); }
  .mapa { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--acc); text-decoration: none; border: 1px solid #5c4a1c; border-radius: 8px; padding: 5px 10px; }
  .galeria { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .galeria .item { position: relative; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: #222; }
  .galeria img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .borrar { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="image.jpg" alt="LA PINTA Barbería" width="110" height="110">
  <div class="titulo">Portal de barberos</div>
</header>
<main class="wrap" id="app"><p class="muted" style="text-align:center">Cargando…</p></main>

<script>
/* Misma API de la web de reservas. */
const API = 'https://script.google.com/macros/s/AKfycbww7Rb-iJORoP9w7244ZZRUBUTDEQHgnBvj28PEhrn79vUb3l5BlB_zzW3M9bJoP4dJyQ/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let S = ls.get('sesionBarbero');   // { token, nombre, id, hasta }
let W = null;                      // semana: { nombre, paso, dias: [...] }
let sel = null;                    // fecha seleccionada
let edit = [];                     // bloques en edición [['09:00','13:00'], ...]

async function api(params) {
  let ultimo;
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(params) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j.ok) { const e = new Error(j.error || 'Error'); e.final = true; throw e; }
      return j;
    } catch (e) {
      if (e.final) {
        if (/sesión expiró/.test(e.message)) { salir(e.message); }
        throw e;
      }
      ultimo = e;
      await new Promise(res => setTimeout(res, 800 * (i + 1)));
    }
  }
  throw new Error('No pudimos conectar. Revisa tu internet.');
}

const aMin = h => { const p = String(h).split(':').map(Number); return p[0] * 60 + p[1]; };
const aHora = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const h12 = h => { const [a, b] = h.split(':').map(Number); return (a % 12 || 12) + ':' + String(b).padStart(2, '0') + (a < 12 ? ' am' : ' pm'); };
const deISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };

/* ---------- Ingreso ---------- */
async function vistaLogin(msg) {
  $('#app').innerHTML = '<p class="muted" style="text-align:center">Cargando…</p>';
  let barberos = ls.get('barberosPortal') || [];
  try {
    const r = await fetch(API + '?a=datos').then(x => x.json());
    if (r.ok) { barberos = r.barberos; ls.set('barberosPortal', barberos); }
  } catch (e) { /* usa la lista guardada */ }
  const ult = ls.get('ultimoBarbero');
  $('#app').innerHTML = `
    <h2>Entrar</h2>
    <label for="barb">Barbero</label>
    <select id="barb">${barberos.map(b => `<option value="${esc(b.id)}" ${b.id === ult ? 'selected' : ''}>${esc(b.nombre)}</option>`).join('')}</select>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••">
    <div class="err" id="err">${esc(msg || '')}</div>
    <button class="btn" id="entrar">Entrar</button>
    <p class="muted">El PIN te lo da el administrador. No lo compartas.</p>`;
  const entrar = async () => {
    const b = $('#entrar'); b.disabled = true; $('#err').textContent = '';
    try {
      const r = await api({ a: 'bLogin', barbero: $('#barb').value, pin: $('#pin').value });
      S = { token: r.token, nombre: r.nombre, id: r.id, hasta: Date.now() + 5.5 * 3600 * 1000 };
      ls.set('sesionBarbero', S); ls.set('ultimoBarbero', r.id);
      cargarSemana();
    } catch (e) { b.disabled = false; $('#err').textContent = e.message; }
  };
  $('#entrar').onclick = entrar;
  $('#pin').onkeydown = e => { if (e.key === 'Enter') entrar(); };
}

function salir(msg) { ls.del('sesionBarbero'); S = null; W = null; sel = null; vistaLogin(msg); }

/* ---------- Semana ---------- */
async function cargarSemana(mantener) {
  if (!mantener) $('#app').innerHTML = '<p class="muted" style="text-align:center">Cargando tus turnos…</p>';
  try {
    W = await api({ a: 'bSemana', token: S.token });
    if (!sel || !W.dias.some(d => d.fecha === sel)) sel = (W.dias.find(d => d.tienda) || W.dias[0]).fecha;
    elegir(sel);
  } catch (e) {
    if (S) $('#app').innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn sec" id="re">Reintentar</button>`;
    if ($('#re')) $('#re').onclick = () => cargarSemana();
  }
}

function etiqueta(d) {
  if (!d.tienda) return '<i class="estado-cerr">Cerrado</i>';
  if (!d.bloques.length) return '<i class="estado-no">Libre</i>';
  return '<i class="estado-ok">' + d.bloques.length + (d.bloques.length === 1 ? ' turno' : ' turnos') + '</i>';
}

function elegir(fecha) {
  sel = fecha;
  const d = W.dias.find(x => x.fecha === fecha);
  edit = d.bloques.map(b => b.slice());
  pintar();
}

function opcionesHora(d, valor) {
  const [a, b] = d.tienda.split('-').map(aMin);
  let html = '';
  for (let t = a; t <= b; t += W.paso) html += `<option value="${aHora(t)}" ${aHora(t) === valor ? 'selected' : ''}>${h12(aHora(t))}</option>`;
  return html;
}

function pintar(msg, tipo) {
  const d = W.dias.find(x => x.fecha === sel);
  const sinTurnos = W.dias.slice(0, 7).filter(x => x.tienda && x.base && !x.bloques.length).length; // solo días que trabaja según su horario base
  let html = `
    ${topHtml('turnos')}
    ${sinTurnos ? `<div class="card"><b>${sinTurnos} ${sinTurnos === 1 ? 'día' : 'días'} sin turno</b> en los próximos 7 días. Si no habilitas turnos, los clientes no pueden reservar contigo.
      <button class="btn sec" id="base">Usar mi horario base en los próximos 7 días</button></div>` : ''}
    <h2>Elige el día</h2>
    <div class="dias">${W.dias.map((x, i) => {
      const f = deISO(x.fecha);
      return `<button class="dia ${x.fecha === sel ? 'on' : ''} ${x.tienda ? '' : 'cerrado'}" data-f="${x.fecha}">
        <small>${i === 0 ? 'Hoy' : i === 1 ? 'Mañ' : DIAS[f.getDay()]}</small><b>${f.getDate()}</b><small>${MESES[f.getMonth()]}</small>${etiqueta(x)}</button>`;
    }).join('')}</div>
    <h2>${esc(d.txt)}</h2>`;
  if (!d.tienda) {
    html += '<div class="card muted">La barbería está cerrada este día.</div>';
  } else {
    html += `<div class="muted">La barbería abre ${esc(d.tienda.replace('-', ' a '))}.${d.base ? ' Tu horario base: ' + esc(d.base.replace('-', ' a ')) + '.' : ''}</div>
      <div class="card">
        <b>Tus turnos</b>
        ${edit.length ? edit.map((b, i) => `
          <div class="bloque">
            <select data-i="${i}" data-k="0" aria-label="Inicio del turno ${i + 1}">${opcionesHora(d, b[0])}</select>
            <span>a</span>
            <select data-i="${i}" data-k="1" aria-label="Fin del turno ${i + 1}">${opcionesHora(d, b[1])}</select>
            <button class="x" data-del="${i}" aria-label="Quitar turno">×</button>
          </div>`).join('') : '<p class="muted">Día libre: no recibes citas este día.</p>'}
        <div class="acciones">
          <button class="btn mini sec" id="agregar">+ Agregar turno</button>
          <button class="btn mini sec" id="todo">Todo el día</button>
          ${d.base ? '<button class="btn mini sec" id="usarBase">Mi horario base</button>' : ''}
          <button class="btn mini sec" id="libre">Día libre</button>
        </div>
        <div id="msg" class="${tipo === 'ok' ? 'okmsg' : 'err'}">${esc(msg || '')}</div>
        <button class="btn" id="guardar">Guardar ${esc(d.txt.split(' ')[0])}</button>
      </div>`;
  }
  html += `<div class="card"><b>Citas de este día</b>${d.citas.length ? d.citas.map(c =>
      `<div class="cita"><span>${h12(c.hora)} · ${esc(c.cliente)}</span><span class="muted">${esc(c.servicio)}${c.estado === 'Pendiente' ? ' · pendiente' : ''}</span></div>`).join('')
      : '<p class="muted">Sin citas todavía.</p>'}</div>`;
  $('#app').innerHTML = html;

  enlacesTop();
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => elegir(b.dataset.f));
  if ($('#base')) $('#base').onclick = async () => {
    const b = $('#base'); b.disabled = true; b.textContent = 'Habilitando…';
    try { const r = await api({ a: 'bCopiarBase', token: S.token }); await cargarSemana(true); pintar(r.texto, 'ok'); }
    catch (e) { b.disabled = false; b.textContent = 'Usar mi horario base en los próximos 7 días'; alert(e.message); }
  };
  if (!d.tienda) return;
  const [ta, tb] = d.tienda.split('-');
  document.querySelectorAll('.bloque select').forEach(s => s.onchange = () => { edit[+s.dataset.i][+s.dataset.k] = s.value; });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { edit.splice(+b.dataset.del, 1); pintar(); });
  $('#agregar').onclick = () => {
    const ult = edit.length ? aMin(edit[edit.length - 1][1]) : aMin(ta);
    const ini = Math.min(ult + (edit.length ? 60 : 0), aMin(tb) - W.paso);
    edit.push([aHora(ini), aHora(Math.min(ini + 240, aMin(tb)))]);
    pintar();
  };
  $('#todo').onclick = () => { edit = [[ta, tb]]; pintar(); };
  if ($('#usarBase')) $('#usarBase').onclick = () => {
    const [ba, bb] = d.base.split('-').map(aMin);
    edit = [[aHora(Math.max(ba, aMin(ta))), aHora(Math.min(bb, aMin(tb)))]];
    pintar();
  };
  $('#libre').onclick = () => { edit = []; pintar(); };
  $('#guardar').onclick = async () => {
    const b = $('#guardar'); b.disabled = true; b.textContent = 'Guardando…'; $('#msg').textContent = '';
    try {
      const r = await api({ a: 'bGuardarDia', token: S.token, fecha: sel, bloques: edit });
      await cargarSemana(true);
      pintar(r.texto, 'ok');
    } catch (e) { b.disabled = false; b.textContent = 'Guardar'; $('#msg').className = 'err'; $('#msg').textContent = e.message; }
  };
}

/* ---------- Mi perfil ---------- */
let PF = null;          // datos del perfil
let fotoNueva;          // undefined = sin cambio, '' = quitar, 'data:...' = nueva

function topHtml(v) {
  return `<div class="top"><div>Hola <b>${esc(S.nombre.split(' ')[0])}</b></div><button class="link" id="salir">Salir</button></div>
    <div class="tabs"><button class="${v === 'turnos' ? 'on' : ''}" data-v="turnos">Mis turnos</button><button class="${v === 'perfil' ? 'on' : ''}" data-v="perfil">Mi perfil</button></div>`;
}

function enlacesTop() {
  $('#salir').onclick = () => salir();
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    if (b.dataset.v === 'perfil') vistaPerfil();
    else if (W) pintar(); else cargarSemana();
  });
}

function procesarImagen(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const lado = Math.min(img.width, img.height), t = 240;
      const c = document.createElement('canvas'); c.width = t; c.height = t;
      const g = c.getContext('2d');
      g.fillStyle = '#000'; g.fillRect(0, 0, t, t);
      g.drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, t, t);
      URL.revokeObjectURL(url);
      let q = 0.85, d = c.toDataURL('image/jpeg', q);
      while (d.length > 40000 && q > 0.45) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      if (d.length > 44000) {
        const c2 = document.createElement('canvas'); c2.width = 160; c2.height = 160;
        c2.getContext('2d').drawImage(c, 0, 0, 160, 160);
        d = c2.toDataURL('image/jpeg', 0.7);
      }
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No pudimos leer esa imagen. Prueba con una foto JPG o PNG.')); };
    img.src = url;
  });
}

function pintarFoto() {
  const f = fotoNueva !== undefined ? fotoNueva : PF.foto;
  const el = $('#pf-img');
  if (f) { el.style.backgroundImage = "url('" + f + "')"; el.textContent = ''; }
  else { el.style.backgroundImage = ''; el.textContent = S.nombre.trim().charAt(0).toUpperCase(); }
  $('#pf-quitar').classList.toggle('hidden', !f);
}

function enlaceMapa() {
  const m = $('#pf-mapa').value.trim(), d = $('#pf-dir').value.trim();
  const href = m || (d ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(d) : '');
  const a = $('#pf-probar');
  a.classList.toggle('hidden', !href);
  if (href) a.href = href;
}

let GALP = []; // mis fotos de trabajos

function procesarTrabajo(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 720, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.8, d = c.toDataURL('image/jpeg', q);
      while (d.length > 170000 && q > 0.4) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      if (d.length > 175000) return rej(new Error('Esa foto es muy pesada. Prueba con otra.'));
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No pudimos leer esa imagen. Prueba con una foto JPG o PNG.')); };
    img.src = url;
  });
}

function pintarGaleria() {
  const g = $('#gal');
  if (!g) return;
  g.innerHTML = GALP.map(f => `<div class="item"><img src="${f.src}" alt=""><button class="borrar" data-borrar="${esc(f.id)}" aria-label="Borrar foto">×</button></div>`).join('');
  $('#gal-vacia').classList.toggle('hidden', GALP.length > 0);
  $('#gal-cuenta').textContent = '(' + GALP.length + ' de 6)';
  $('#gal-add').classList.toggle('hidden', GALP.length >= 6);
  g.querySelectorAll('[data-borrar]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Borrar esta foto?')) return;
    b.disabled = true;
    try {
      await api({ a: 'bBorrarFoto', token: S.token, id: b.dataset.borrar });
      GALP = GALP.filter(f => f.id !== b.dataset.borrar);
      pintarGaleria();
    } catch (e) { b.disabled = false; $('#gal-msg').className = 'err'; $('#gal-msg').textContent = e.message; }
  });
}

async function iniciarGaleria() {
  $('#gal-msg').className = 'muted'; $('#gal-msg').textContent = 'Cargando tus fotos…';
  try { GALP = (await api({ a: 'bGaleria', token: S.token })).fotos; $('#gal-msg').textContent = ''; }
  catch (e) { GALP = []; $('#gal-msg').className = 'err'; $('#gal-msg').textContent = e.message; }
  pintarGaleria();
  $('#gal-file').onchange = async e => {
    const files = Array.from(e.target.files).slice(0, Math.max(0, 6 - GALP.length));
    e.target.value = '';
    for (let i = 0; i < files.length; i++) {
      $('#gal-msg').className = 'muted'; $('#gal-msg').textContent = 'Subiendo foto ' + (i + 1) + ' de ' + files.length + '…';
      try {
        const d = await procesarTrabajo(files[i]);
        const r = await api({ a: 'bSubirFoto', token: S.token, datos: d });
        GALP.push({ id: r.id, src: d });
        pintarGaleria();
      } catch (err) { $('#gal-msg').className = 'err'; $('#gal-msg').textContent = err.message; return; }
    }
    $('#gal-msg').className = 'okmsg';
    $('#gal-msg').textContent = files.length ? 'Listo. Ya se ven en la web.' : 'Ya tienes 6 fotos. Borra una para subir otra.';
  };
}

async function vistaPerfil() {
  $('#app').innerHTML = topHtml('perfil') + '<p class="muted" style="text-align:center">Cargando tu perfil…</p>';
  enlacesTop();
  try { PF = await api({ a: 'bPerfil', token: S.token }); }
  catch (e) { if (S) $('#app').innerHTML = topHtml('perfil') + `<div class="err">${esc(e.message)}</div>`; if (S) enlacesTop(); return; }
  fotoNueva = undefined;
  const todos = !PF.servicios.length;
  $('#app').innerHTML = topHtml('perfil') + `
    <p class="muted">Así te ven los clientes en la web de reservas.</p>
    <div class="card">
      <b>Foto o logo</b>
      <div class="perfil-foto">
        <div class="foto-grande" id="pf-img" role="img" aria-label="Tu foto"></div>
        <label class="btn mini sec" for="pf-file">Cambiar foto</label>
        <input type="file" id="pf-file" accept="image/*" class="hidden">
        <button class="btn mini sec" id="pf-quitar">Quitar</button>
      </div>
      <p class="muted">Se muestra en círculo. Usa una imagen cuadrada y clara.</p>
    </div>
    <div class="card">
      <b>Fotos de mis trabajos</b> <span class="muted" id="gal-cuenta"></span>
      <div class="galeria" id="gal"></div>
      <p class="muted hidden" id="gal-vacia">Todavía no has subido fotos.</p>
      <label class="btn mini sec" for="gal-file" id="gal-add" style="margin-top:10px">+ Agregar fotos</label>
      <input type="file" id="gal-file" accept="image/*" multiple class="hidden">
      <div id="gal-msg" class="muted"></div>
      <p class="muted">Se muestran en un carrusel cuando el cliente te elige en la web. Hasta 6 fotos.</p>
    </div>
    <div class="card">
      <label for="pf-dir">Dirección donde atiendes</label>
      <input id="pf-dir" maxlength="140" value="${esc(PF.direccion)}" placeholder="Calle 72 # 45-10, local 2">
      <label for="pf-mapa">Enlace de Google Maps (opcional)</label>
      <input id="pf-mapa" inputmode="url" value="${esc(PF.mapa)}" placeholder="https://maps.app.goo.gl/...">
      <p class="muted">En Google Maps busca tu local → Compartir → Copiar enlace, y pégalo aquí. Si lo dejas vacío, usamos la dirección.</p>
      <a id="pf-probar" class="mapa hidden" target="_blank" rel="noopener">Probar ubicación ↗</a>
    </div>
    <div class="card">
      <b>Servicios que ofreces</b>
      ${PF.catalogo.map(s => `<label class="serv"><span>${esc(s.nombre)} <span class="muted">· $${String(s.precio).replace(/\B(?=(\d{3})+(?!\d))/g, '.')} · ${s.dur} min</span></span>
        <input type="checkbox" value="${esc(s.id)}" ${todos || PF.servicios.indexOf(s.id) >= 0 ? 'checked' : ''}></label>`).join('')}
    </div>
    <div id="pf-msg" class="err"></div>
    <button class="btn" id="pf-guardar">Guardar perfil</button>`;
  enlacesTop();
  pintarFoto(); enlaceMapa();
  $('#pf-dir').oninput = enlaceMapa; $('#pf-mapa').oninput = enlaceMapa;
  $('#pf-file').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    $('#pf-msg').className = 'muted'; $('#pf-msg').textContent = 'Procesando imagen…';
    try { fotoNueva = await procesarImagen(file); pintarFoto(); $('#pf-msg').textContent = 'Foto lista. Toca "Guardar perfil" para publicarla.'; }
    catch (err) { $('#pf-msg').className = 'err'; $('#pf-msg').textContent = err.message; }
    e.target.value = '';
  };
  $('#pf-quitar').onclick = () => { fotoNueva = ''; pintarFoto(); };
  iniciarGaleria();
  $('#pf-guardar').onclick = async () => {
    const servicios = Array.from(document.querySelectorAll('.serv input:checked')).map(i => i.value);
    const b = $('#pf-guardar'); b.disabled = true; b.textContent = 'Guardando…';
    $('#pf-msg').className = 'err'; $('#pf-msg').textContent = '';
    try {
      const r = await api({ a: 'bGuardarPerfil', token: S.token, direccion: $('#pf-dir').value, mapa: $('#pf-mapa').value, servicios, foto: fotoNueva === undefined ? null : fotoNueva });
      if (fotoNueva !== undefined) PF.foto = fotoNueva;
      fotoNueva = undefined;
      $('#pf-msg').className = 'okmsg'; $('#pf-msg').textContent = r.texto;
    } catch (e) { $('#pf-msg').textContent = e.message; }
    b.disabled = false; b.textContent = 'Guardar perfil';
  };
}

if (S && S.token && S.hasta > Date.now()) cargarSemana(); else vistaLogin();
</script>
</body>
</html>
