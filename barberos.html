<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA PINTA · Portal de barberos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #010101; --card: #161616; --card2: #222; --line: #2e2e2e; --txt: #f2f2f2; --sub: #a3a3a3;
          --acc: #e0b04a; --acc-txt: #161208; --ok: #2fbf71; --err: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 Inter, system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 60px; }
  header { text-align: center; padding: 14px 16px 4px; background:
    repeating-linear-gradient(135deg, #b3262d 0 10px, #f2f2f2 10px 20px, #1f4fa8 20px 30px, #f2f2f2 30px 40px) top / 100% 6px no-repeat; }
  header img { width: 110px; height: auto; margin-top: 8px;
    -webkit-mask-image: radial-gradient(circle closest-side, #000 92%, transparent 100%); mask-image: radial-gradient(circle closest-side, #000 92%, transparent 100%); }
  .titulo { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 26px; letter-spacing: 1px; }
  h2 { font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 24px; margin: 20px 0 8px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 5px; }
  input, select { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 12px; outline: none; }
  input:focus, select:focus { border-color: var(--acc); }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; cursor: pointer;
         background: var(--acc); color: var(--acc-txt); margin-top: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sec { background: var(--card2); color: var(--txt); }
  .btn.mini { display: inline-block; width: auto; padding: 9px 12px; font-size: 14px; margin: 0; }
  .fila { display: flex; gap: 8px; align-items: center; }
  .fila > * { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 10px; }
  .muted { color: var(--sub); font-size: 13px; }
  .err { color: var(--err); font-size: 14px; margin-top: 10px; }
  .okmsg { color: var(--ok); font-size: 14px; margin-top: 10px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .link { background: none; border: 0; color: var(--sub); text-decoration: underline; cursor: pointer; padding: 6px; }
  .dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .dias::-webkit-scrollbar { display: none; }
  .dia { min-width: 0; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 2px; cursor: pointer; }
  .dia small { display: block; color: var(--sub); font-size: 11px; text-transform: uppercase; }
  .dia b { font-size: 18px; display: block; }
  .dia i { display: block; font-style: normal; font-size: 10px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dia.on { border-color: var(--acc); background: #241e10; }
  .dia.cerrado { opacity: .4; }
  .estado-ok { color: var(--ok); } .estado-no { color: var(--err); } .estado-cerr { color: var(--sub); }
  .bloque { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; margin-top: 8px; }
  .bloque span { color: var(--sub); }
  .x { background: var(--card2); border: 0; border-radius: 10px; width: 42px; height: 42px; font-size: 18px; cursor: pointer; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .cita { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .cita:last-child { border: 0; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tabs button { flex: 1; border: 0; background: var(--card); padding: 10px; border-radius: 10px; color: var(--sub); font-weight: 600; cursor: pointer; }
  .tabs button.on { background: var(--acc); color: var(--acc-txt); }
  .perfil-foto { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .foto-grande { width: 96px; height: 96px; border-radius: 50%; background: #2a2a2a center / cover no-repeat; border: 2px solid var(--acc);
                 display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', Impact, sans-serif; font-size: 42px; color: var(--acc); }
  .serv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; margin: 0; border-bottom: 1px dashed var(--line); color: var(--txt); font-size: 14px; cursor: pointer; }
  .serv:last-child { border: 0; }
  .serv input { width: 22px; height: 22px; flex: 0 0 22px; accent-color: var(--acc); }
  .mapa { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--acc); text-decoration: none; border: 1px solid #5c4a1c; border-radius: 8px; padding: 5px 10px; }
  .galeria { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .galeria .item { position: relative; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: #222; }
  .galeria img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .borrar { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
  .sv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .fila2 { display: flex; gap: 8px; } .fila2 > div { flex: 1; min-width: 0; }
  .tabs button { padding: 10px 4px; font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chip { background: var(--card2); border: 0; border-radius: 20px; padding: 7px 12px; font-size: 14px; cursor: pointer; color: var(--txt); }
  .chip.on { background: var(--acc); color: var(--acc-txt); font-weight: 600; }
  .gan { border-color: #5a4515; background: #1d180c; }
  .grande-g { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 44px; letter-spacing: 1px; color: var(--acc); line-height: 1.1; }
  .lineas > div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .lineas > div:last-child { border: 0; } .lineas > div span { color: var(--sub); }
  .btn.peligro { background: #2a1414; color: var(--err); }
  .rep label { font-size: 12px; margin: 0 0 4px; display: block; color: var(--sub); }
  .rep input, .rep select { padding: 9px; }
  .hidden { display: none !important; }
  .ant { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 20px; background: #2b2410; color: var(--acc); white-space: nowrap; }
  .ant.ok { background: #10261a; color: var(--ok); }
  .cita-box { padding: 6px 0; border-bottom: 1px dashed var(--line); } .cita-box:last-child { border: 0; }
  .cita-box .cita { border: 0; padding: 0; }
  .wa { display: inline-block; margin-top: 8px; background: #25d366; color: #06210f; border-radius: 10px; padding: 8px 12px; font-weight: 700; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<header>
  <img src="image.jpg" alt="LA PINTA Barbería" width="110" height="110">
  <div class="titulo">Portal de barberos</div>
</header>
<main class="wrap" id="app"><p class="muted" style="text-align:center">Cargando…</p></main>

<script>
/* Misma API de la web de reservas. */
const API = 'https://script.google.com/macros/s/AKfycbww7Rb-iJORoP9w7244ZZRUBUTDEQHgnBvj28PEhrn79vUb3l5BlB_zzW3M9bJoP4dJyQ/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let S = ls.get('sesionBarbero');   // { token, nombre, id, hasta }
let W = null;                      // semana: { nombre, paso, dias: [...] }
let sel = null;                    // fecha seleccionada
let edit = [];                     // bloques en edición [['09:00','13:00'], ...]

async function api(params) {
  let ultimo;
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(params) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j.ok) { const e = new Error(j.error || 'Error'); e.final = true; throw e; }
      return j;
    } catch (e) {
      if (e.final) {
        if (/sesión expiró/.test(e.message)) { salir(e.message); }
        throw e;
      }
      ultimo = e;
      await new Promise(res => setTimeout(res, 800 * (i + 1)));
    }
  }
  throw new Error('No pudimos conectar. Revisa tu internet.');
}

const aMin = h => { const p = String(h).split(':').map(Number); return p[0] * 60 + p[1]; };
const aHora = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const h12 = h => { const [a, b] = h.split(':').map(Number); return (a % 12 || 12) + ':' + String(b).padStart(2, '0') + (a < 12 ? ' am' : ' pm'); };
const deISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };

/* ---------- Ingreso ---------- */
async function vistaLogin(msg) {
  $('#app').innerHTML = '<p class="muted" style="text-align:center">Cargando…</p>';
  let barberos = ls.get('barberosPortal') || [];
  try {
    const r = await fetch(API + '?a=datos').then(x => x.json());
    if (r.ok) { barberos = r.barberos; ls.set('barberosPortal', barberos); }
  } catch (e) { /* usa la lista guardada */ }
  const ult = ls.get('ultimoBarbero');
  $('#app').innerHTML = `
    <h2>Entrar</h2>
    <label for="barb">Barbero</label>
    <select id="barb">${barberos.map(b => `<option value="${esc(b.id)}" ${b.id === ult ? 'selected' : ''}>${esc(b.nombre)}</option>`).join('')}</select>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••">
    <div class="err" id="err">${esc(msg || '')}</div>
    <button class="btn" id="entrar">Entrar</button>
    <p class="muted">El PIN te lo da el administrador. No lo compartas.</p>`;
  const entrar = async () => {
    const b = $('#entrar'); b.disabled = true; $('#err').textContent = '';
    try {
      const r = await api({ a: 'bLogin', barbero: $('#barb').value, pin: $('#pin').value });
      S = { token: r.token, nombre: r.nombre, id: r.id, hasta: Date.now() + 5.5 * 3600 * 1000 };
      ls.set('sesionBarbero', S); ls.set('ultimoBarbero', r.id);
      cargarSemana();
    } catch (e) { b.disabled = false; $('#err').textContent = e.message; }
  };
  $('#entrar').onclick = entrar;
  $('#pin').onkeydown = e => { if (e.key === 'Enter') entrar(); };
}

function salir(msg) { ls.del('sesionBarbero'); S = null; W = null; sel = null; vistaLogin(msg); }

/* ---------- Semana ---------- */
async function cargarSemana(mantener) {
  if (!mantener) $('#app').innerHTML = '<p class="muted" style="text-align:center">Cargando tus turnos…</p>';
  try {
    W = await api({ a: 'bSemana', token: S.token });
    if (!sel || !W.dias.some(d => d.fecha === sel)) sel = (W.dias.find(d => d.tienda) || W.dias[0]).fecha;
    elegir(sel);
  } catch (e) {
    if (S) $('#app').innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn sec" id="re">Reintentar</button>`;
    if ($('#re')) $('#re').onclick = () => cargarSemana();
  }
}

function etiqueta(d) {
  if (!d.tienda && !d.bloques.length) return '<i class="estado-cerr">Cerrado</i>';
  if (!d.bloques.length) return '<i class="estado-no">Libre</i>';
  return '<i class="estado-ok">' + d.bloques.length + (d.bloques.length === 1 ? ' turno' : ' turnos') + '</i>';
}

function elegir(fecha) {
  sel = fecha;
  const d = W.dias.find(x => x.fecha === fecha);
  edit = d.bloques.map(b => b.slice());
  pintar();
}

function opcionesHora(d, valor) {
  let html = '', hay = false;
  for (let t = 0; t < 1440; t += W.paso) { const h = aHora(t); if (h === valor) hay = true; html += `<option value="${h}" ${h === valor ? 'selected' : ''}>${h12(h)}</option>`; }
  if (valor && !hay) html = `<option value="${valor}" selected>${h12(valor)}</option>` + html;
  return html;
}

function pintar(msg, tipo) {
  const d = W.dias.find(x => x.fecha === sel);
  const sinTurnos = W.dias.slice(0, 7).filter(x => x.tienda && x.base && !x.bloques.length).length; // solo días que trabaja según su horario base
  let html = `
    ${topHtml('turnos')}
    ${sinTurnos ? `<div class="card"><b>${sinTurnos} ${sinTurnos === 1 ? 'día' : 'días'} sin turno</b> en los próximos 7 días. Si no habilitas turnos, los clientes no pueden reservar contigo.
      <button class="btn sec" id="base">Usar mi horario base en los próximos 7 días</button></div>` : ''}
    <h2>Elige el día</h2>
    <div class="dias">${W.dias.map((x, i) => {
      const f = deISO(x.fecha);
      return `<button class="dia ${x.fecha === sel ? 'on' : ''} ${x.tienda ? '' : 'cerrado'}" data-f="${x.fecha}">
        <small>${i === 0 ? 'Hoy' : i === 1 ? 'Mañ' : DIAS[f.getDay()]}</small><b>${f.getDate()}</b><small>${MESES[f.getMonth()]}</small>${etiqueta(x)}</button>`;
    }).join('')}</div>
    <h2>${esc(d.txt)}</h2>`;
  {
    html += `<div class="muted">${d.tienda ? 'La barbería abre ' + esc(d.tienda.replace('-', ' a ')) + '.' : 'La barbería está cerrada este día; si atiendes, habilita tus turnos.'}${d.base ? ' Tu horario base: ' + esc(d.base.replace('-', ' a ')) + '.' : ''}</div>
      <div class="card">
        <b>Tus turnos</b>
        <p class="muted" style="margin:4px 0 0">Cambia las horas, quita un turno con × o agrega otro, y toca Guardar.</p>
        ${edit.length ? edit.map((b, i) => `
          <div class="bloque">
            <select data-i="${i}" data-k="0" aria-label="Inicio del turno ${i + 1}">${opcionesHora(d, b[0])}</select>
            <span>a</span>
            <select data-i="${i}" data-k="1" aria-label="Fin del turno ${i + 1}">${opcionesHora(d, b[1])}</select>
            <button class="x" data-del="${i}" aria-label="Quitar turno">×</button>
          </div>`).join('') : '<p class="muted">Día libre: no recibes citas este día.</p>'}
        <div class="acciones">
          <button class="btn mini sec" id="agregar">+ Agregar turno</button>
          <button class="btn mini sec" id="todo">Todo el día</button>
          ${d.base ? '<button class="btn mini sec" id="usarBase">Mi horario base</button>' : ''}
          <button class="btn mini sec" id="libre">Día libre</button>
        </div>
        <div id="msg" class="${tipo === 'ok' ? 'okmsg' : 'err'}">${esc(msg || '')}</div>
        <button class="btn" id="guardar">Guardar ${esc(d.txt.split(' ')[0])}</button>
      </div>`;
  }
  html += `<div class="card"><b>Citas de este día</b>${d.citas.length ? d.citas.map(c => {
      const pend = c.anticipo > 0 && (c.anticipoEstado === 'Pendiente' || !c.anticipoEstado);
      return `<div class="cita-box"><div class="cita"><span>${h12(c.hora)} · ${esc(c.cliente)}</span><span class="muted">${esc(c.servicio)}${c.estado === 'Pendiente' ? ' · pendiente' : ''}</span></div>
        ${c.anticipo > 0 ? `<span class="ant ${c.anticipoEstado === 'Recibido' ? 'ok' : ''}">Anticipo ${pesosB(c.anticipo)} · ${c.anticipoEstado === 'Recibido' ? 'recibido' : pend ? 'por pagar' : esc(c.anticipoEstado.toLowerCase())}</span>` : ''}
        ${c.id && (pend || !(c.anticipo > 0)) ? `<div style="margin-top:6px"><button class="btn mini ${pend ? '' : 'sec'}" data-ant="${esc(c.id)}">${pend ? '✓ Recibí el anticipo' : '+ Registrar anticipo'}</button></div>` : ''}
        ${citaAcciones(c, d)}
      </div>`; }).join('') + '<div id="ant-msg"></div>'
      : '<p class="muted">Sin citas todavía.</p>'}</div>`;
  $('#app').innerHTML = html;

  enlacesTop();
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => elegir(b.dataset.f));
  document.querySelectorAll('[data-ant]').forEach(b => b.onclick = async () => {
    const c = d.citas.find(x => x.id === b.dataset.ant);
    const v = prompt('Anticipo recibido de ' + c.cliente + ' (' + c.servicio + '). Valor:', c.anticipo > 0 ? c.anticipo : '');
    if (v === null) return;
    b.disabled = true;
    try {
      const r = await api({ a: 'bAnticipoCita', token: S.token, cita: c.id, valor: v });
      await cargarSemana(true);
      $('#ant-msg').innerHTML = `<div class="okmsg">${esc(r.texto)}</div>${r.wa ? `<a class="wa" target="_blank" rel="noopener" href="${esc(r.wa)}">Avisar al cliente por WhatsApp</a>` : ''}`;
    } catch (e) { b.disabled = false; alert(e.message); }
  });
  enlacesCitas(d);
  if ($('#base')) $('#base').onclick = async () => {
    const b = $('#base'); b.disabled = true; b.textContent = 'Habilitando…';
    try { const r = await api({ a: 'bCopiarBase', token: S.token }); await cargarSemana(true); pintar(r.texto, 'ok'); }
    catch (e) { b.disabled = false; b.textContent = 'Usar mi horario base en los próximos 7 días'; alert(e.message); }
  };
  const rt = String(d.tienda || d.base || '09:00-19:00').match(/\d{1,2}:\d{2}/g).map(h => h.padStart(5, '0'));
  const ta = rt[0], tb = rt[1] || '19:00';
  document.querySelectorAll('.bloque select').forEach(s => s.onchange = () => { edit[+s.dataset.i][+s.dataset.k] = s.value; });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { edit.splice(+b.dataset.del, 1); pintar(); });
  $('#agregar').onclick = () => {
    const ult = edit.length ? aMin(edit[edit.length - 1][1]) : aMin(ta);
    const tope = edit.length ? 1440 - W.paso : aMin(tb);
    const ini = Math.min(ult + (edit.length ? 60 : 0), tope - W.paso);
    edit.push([aHora(ini), aHora(Math.min(ini + 240, tope))]);
    pintar();
  };
  $('#todo').onclick = () => { edit = [[ta, tb]]; pintar(); };
  if ($('#usarBase')) $('#usarBase').onclick = () => {
    const [ba, bb] = d.base.split('-').map(aMin);
    edit = [[aHora(ba), aHora(bb)]];
    pintar();
  };
  $('#libre').onclick = () => { edit = []; pintar(); };
  $('#guardar').onclick = async () => {
    const b = $('#guardar'); b.disabled = true; b.textContent = 'Guardando…'; $('#msg').textContent = '';
    try {
      let r;
      try { r = await api({ a: 'bGuardarDia', token: S.token, fecha: sel, bloques: edit }); }
      catch (e) { if (!/citas fuera/.test(e.message) || !confirm(e.message + '\n\n¿Guardar de todas formas?')) throw e; r = await api({ a: 'bGuardarDia', token: S.token, fecha: sel, bloques: edit, forzar: true }); }
      await cargarSemana(true);
      pintar(r.texto, 'ok');
    } catch (e) { b.disabled = false; b.textContent = 'Guardar'; $('#msg').className = 'err'; $('#msg').textContent = e.message; }
  };
}

/* ---------- Citas: confirmar, reprogramar, cancelar ---------- */
function citaAcciones(c, d) {
  if (!c.id) return '';
  const hoy = W.dias[0].fecha;
  const b = [];
  if (c.estado === 'Pendiente') b.push(`<button class="btn mini" data-cacc="Confirmada" data-cid="${esc(c.id)}">Confirmar</button>`);
  b.push(`<button class="btn mini sec" data-crep="${esc(c.id)}">Reprogramar</button>`);
  if (c.estado === 'Confirmada' && d.fecha <= hoy) b.push(`<button class="btn mini sec" data-cacc="No asistió" data-cid="${esc(c.id)}">No asistió</button>`);
  b.push(`<button class="btn mini peligro" data-cacc="Cancelada" data-cid="${esc(c.id)}">${c.estado === 'Pendiente' ? 'Rechazar' : 'Cancelar'}</button>`);
  return `<div class="acciones" style="margin-top:6px">${b.join('')}</div><div class="rep" data-repbox="${esc(c.id)}"></div>`;
}

function avisoCita(r) {
  if (!$('#ant-msg')) { const x = document.createElement('div'); x.id = 'ant-msg'; x.className = 'card'; $('#app').appendChild(x); }
  $('#ant-msg').innerHTML = `<div class="okmsg">${esc(r.texto)}</div>${r.wa ? `<a class="wa" target="_blank" rel="noopener" href="${esc(r.wa)}">Avisar al cliente por WhatsApp</a>` : ''}`;
  $('#ant-msg').scrollIntoView({ block: 'center' });
}

function enlacesCitas(d) {
  document.querySelectorAll('[data-cacc]').forEach(b => b.onclick = async () => {
    const c = d.citas.find(x => x.id === b.dataset.cid), acc = b.dataset.cacc;
    const q = { 'Cancelada': '¿' + (c.estado === 'Pendiente' ? 'Rechazar' : 'Cancelar') + ' la cita de ' + c.cliente + ' a las ' + h12(c.hora) + '?', 'No asistió': '¿Marcar que ' + c.cliente + ' no vino?' }[acc];
    if (q && !confirm(q)) return;
    b.disabled = true;
    try { const r = await api({ a: 'bEstadoCita', token: S.token, cita: c.id, estado: acc }); await cargarSemana(true); avisoCita(r); }
    catch (e) { b.disabled = false; alert(e.message); }
  });
  document.querySelectorAll('[data-crep]').forEach(b => b.onclick = () => {
    const c = d.citas.find(x => x.id === b.dataset.crep);
    const caja = document.querySelector(`[data-repbox="${c.id}"]`);
    if (caja.innerHTML) { caja.innerHTML = ''; return; }
    const hoy = W.dias[0].fecha, max = W.dias[W.dias.length - 1].fecha;
    caja.innerHTML = `<div class="fila2" style="margin-top:8px">
        <div><label>Nuevo día</label><input type="date" class="rp-f" min="${hoy}" max="${max}" value="${d.fecha}"></div>
        <div><label>Nueva hora</label><select class="rp-h"><option value="">Cargando…</option></select></div></div>
      <button class="btn mini rp-ok" style="margin-top:8px">Guardar cambio</button> <span class="muted rp-msg"></span>`;
    const f = caja.querySelector('.rp-f'), h = caja.querySelector('.rp-h');
    let n = 0;
    const cargar = async () => {
      const k = ++n; h.innerHTML = '<option value="">Cargando…</option>';
      try {
        const r = await api({ a: 'bLibres', token: S.token, cita: c.id, fecha: f.value });
        if (k !== n) return;
        h.innerHTML = r.libres.length ? r.libres.map(s => `<option value="${s.hora}" ${s.hora === c.hora ? 'selected' : ''}>${h12(s.hora)}</option>`).join('') : '<option value="">Sin horas libres ese día</option>';
      } catch (e) { if (k === n) h.innerHTML = '<option value="">' + esc(e.message) + '</option>'; }
    };
    f.onchange = cargar; cargar();
    caja.querySelector('.rp-ok').onclick = async e => {
      if (!h.value) { caja.querySelector('.rp-msg').textContent = 'Elige una hora libre. Si no hay, agrega un turno ese día.'; return; }
      e.target.disabled = true;
      try { const r = await api({ a: 'bMoverCita', token: S.token, cita: c.id, fecha: f.value, hora: h.value }); await cargarSemana(true); avisoCita(r); }
      catch (x) { e.target.disabled = false; caja.querySelector('.rp-msg').textContent = x.message; }
    };
  });
}

/* ---------- Mis servicios ---------- */
let SV = [];
const pesosB = v => '$' + String(Math.round(v || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

async function vistaServicios(msg) {
  $('#app').innerHTML = topHtml('servicios') + '<p class="muted" style="text-align:center">Cargando tus servicios…</p>';
  enlacesTop();
  try { SV = (await api({ a: 'bServicios', token: S.token })).servicios; }
  catch (e) { if (S) { $('#app').innerHTML = topHtml('servicios') + `<div class="err">${esc(e.message)}</div>`; enlacesTop(); } return; }
  const activos = SV.filter(x => x.activo);
  $('#app').innerHTML = topHtml('servicios') + `
    <p class="muted">Escribe todo lo que ofreces, con tu precio y cuánto te demoras. Es lo que ven los clientes al elegirte en la web.</p>
    ${msg ? `<div class="okmsg">${esc(msg)}</div>` : ''}
    <button class="btn" id="sv-nuevo">+ Agregar servicio</button>
    ${SV.length ? SV.map(x => `<div class="card">
        <div class="sv-top"><div><b>${esc(x.nombre)}</b>${x.activo ? '' : ' <span class="muted">· oculto</span>'}
          <div class="muted">${pesosB(x.precio)} · ${x.dur} min</div>
          ${x.desc ? `<div class="muted">${esc(x.desc)}</div>` : ''}</div>
          <button class="btn mini sec" data-sv="${esc(x.id)}">Editar</button></div>
      </div>`).join('')
      : '<div class="card muted">Todavía no tienes servicios propios. Mientras tanto, en la web se muestran los servicios de la barbería.</div>'}
    ${SV.length && !activos.length ? '<p class="muted">Todos tus servicios están ocultos: en la web se muestran los de la barbería.</p>' : ''}`;
  enlacesTop();
  $('#sv-nuevo').onclick = () => formServicio(null);
  document.querySelectorAll('[data-sv]').forEach(b => b.onclick = () => formServicio(SV.find(x => x.id === b.dataset.sv)));
}

function formServicio(x) {
  const nuevo = !x;
  x = x || { nombre: '', precio: '', dur: 30, desc: '', activo: true };
  const durs = [10, 15, 20, 25, 30, 40, 45, 50, 60, 75, 90, 120, 150, 180];
  if (durs.indexOf(x.dur) < 0) durs.push(x.dur), durs.sort((a, b) => a - b);
  $('#app').innerHTML = topHtml('servicios') + `
    <h2>${nuevo ? 'Nuevo servicio' : 'Editar servicio'}</h2>
    <div class="card">
      <label for="sv-nombre">Nombre</label>
      <input id="sv-nombre" maxlength="50" value="${esc(x.nombre)}" placeholder="Corte degradado">
      <div class="fila2">
        <div><label for="sv-precio">Precio</label><input id="sv-precio" inputmode="numeric" value="${x.precio === '' ? '' : esc(x.precio)}" placeholder="25000"></div>
        <div><label for="sv-dur">Duración</label><select id="sv-dur">${durs.map(d => `<option value="${d}" ${d === x.dur ? 'selected' : ''}>${d} min</option>`).join('')}</select></div>
      </div>
      <label for="sv-desc">Descripción (opcional)</label>
      <input id="sv-desc" maxlength="140" value="${esc(x.desc)}" placeholder="Incluye lavado y perfilado de cejas">
      <label class="serv" style="border:0"><span>Mostrar en la web</span><input type="checkbox" id="sv-activo" ${x.activo ? 'checked' : ''}></label>
    </div>
    <div id="sv-msg" class="err"></div>
    <button class="btn" id="sv-guardar">${nuevo ? 'Agregar servicio' : 'Guardar cambios'}</button>
    ${nuevo ? '' : '<button class="btn sec" id="sv-borrar">Borrar servicio</button>'}
    <button class="btn sec" id="sv-volver">Volver</button>`;
  enlacesTop();
  $('#sv-volver').onclick = () => vistaServicios();
  $('#sv-guardar').onclick = async () => {
    const b = $('#sv-guardar'); b.disabled = true; $('#sv-msg').textContent = '';
    try {
      const r = await api({ a: 'bGuardarServicio', token: S.token, id: nuevo ? '' : x.id, nombre: $('#sv-nombre').value, precio: $('#sv-precio').value,
        dur: Number($('#sv-dur').value), desc: $('#sv-desc').value, activo: $('#sv-activo').checked });
      vistaServicios(r.texto);
    } catch (e) { b.disabled = false; $('#sv-msg').textContent = e.message; }
  };
  if (!nuevo) $('#sv-borrar').onclick = async () => {
    if (!confirm('¿Borrar "' + x.nombre + '"?')) return;
    const b = $('#sv-borrar'); b.disabled = true; $('#sv-msg').textContent = '';
    try { const r = await api({ a: 'bBorrarServicio', token: S.token, id: x.id }); vistaServicios(r.texto); }
    catch (e) { b.disabled = false; $('#sv-msg').textContent = e.message; }
  };
}

/* ---------- Mis ganancias ---------- */
let G = { rango: 'semana' };
function rangoG(r) {
  const hoy = new Date(Date.now() - 5 * 3600 * 1000).toISOString().slice(0, 10), d = new Date(hoy + 'T12:00:00'), iso = x => x.toISOString().slice(0, 10);
  if (r === 'hoy') return [hoy, hoy];
  if (r === 'mes') return [hoy.slice(0, 8) + '01', hoy];
  if (r === 'mesant') return [iso(new Date(d.getFullYear(), d.getMonth() - 1, 1, 12)), iso(new Date(d.getFullYear(), d.getMonth(), 0, 12))];
  const l = new Date(d); l.setDate(l.getDate() - ((l.getDay() + 6) % 7)); return [iso(l), hoy];
}
async function vistaGanancias() {
  $('#app').innerHTML = topHtml('ganancias') + '<p class="muted" style="text-align:center">Calculando…</p>';
  enlacesTop();
  const [desde, hasta] = rangoG(G.rango);
  let d;
  try { d = await api({ a: 'bGanancias', token: S.token, desde, hasta }); }
  catch (e) { if (S) { $('#app').innerHTML = topHtml('ganancias') + `<div class="err">${esc(e.message)}</div>`; enlacesTop(); } return; }
  const y = d.yo || { servicios: 0, cobrado: 0, parte: 0, propinas: 0, pagar: 0, barberia: 0, tipo: 'Comisión', pct: '', arriendo: 0, arriendoSemanal: 0 };
  const chips = [['hoy', 'Hoy'], ['semana', 'Esta semana'], ['mes', 'Este mes'], ['mesant', 'Mes pasado']];
  $('#app').innerHTML = topHtml('ganancias') + `
    <div class="chips">${chips.map(c => `<button class="chip ${G.rango === c[0] ? 'on' : ''}" data-g="${c[0]}">${c[1]}</button>`).join('')}</div>
    <h2>${esc(d.periodoTxt)}</h2>
    <div class="card gan">
      <div class="muted">${y.pagar < 0 ? 'Le debes a la barbería (arriendo)' : 'Te corresponde'}</div>
      <div class="grande-g">${pesosB(Math.abs(y.pagar))}</div>
      <div class="muted">${y.servicios} ${y.servicios === 1 ? 'servicio' : 'servicios'} · ${y.tipo === 'Arriendo' ? 'arriendo ' + pesosB(y.arriendoSemanal) + ' por semana' : 'tu comisión es del ' + y.pct + '%'}</div>
    </div>
    <div class="card lineas">
      <div><span>Cobrado a tus clientes</span><b>${pesosB(y.cobrado)}</b></div>
      <div><span>${y.tipo === 'Arriendo' ? 'Tus servicios' : 'Tu comisión'}</span><b>${pesosB(y.tipo === 'Arriendo' ? y.parte + y.arriendo : y.parte)}</b></div>
      ${y.tipo === 'Arriendo' ? `<div><span>Arriendo del periodo</span><b>− ${pesosB(y.arriendo)}</b></div>` : ''}
      <div><span>Propinas</span><b>${pesosB(y.propinas)}</b></div>
      <div><span>${y.tipo === 'Arriendo' ? 'Arriendo para la barbería' : 'Comisión de la barbería'}</span><b>${pesosB(y.barberia)}</b></div>
    </div>
    ${d.serviciosTop.length ? `<div class="card"><b>Lo que más hiciste</b><div class="lineas">${d.serviciosTop.map(s => `<div><span>${esc(s.nombre)} · ${s.cantidad}</span><b>${pesosB(s.valor)}</b></div>`).join('')}</div></div>` : ''}
    <div class="card"><b>Tus cobros</b>${d.cobros.length ? d.cobros.map(x => `<div class="cita"><span>${esc(x.fecha.slice(8))}/${esc(x.fecha.slice(5, 7))} · ${esc(x.cliente)}</span><span class="muted">${esc(x.concepto)} · ${pesosB(x.valor)}${x.propina ? ' + ' + pesosB(x.propina) : ''}</span></div>`).join('') : '<p class="muted">Todavía no hay cobros registrados en este periodo.</p>'}</div>
    <p class="muted">Se cuenta lo que la barbería registra al cobrar cada servicio.</p>`;
  enlacesTop();
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { G.rango = b.dataset.g; vistaGanancias(); });
}

function procesarImagen(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const lado = Math.min(img.width, img.height), t = 240;
      const c = document.createElement('canvas'); c.width = t; c.height = t;
      const g = c.getContext('2d');
      g.fillStyle = '#000'; g.fillRect(0, 0, t, t);
      g.drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, t, t);
      URL.revokeObjectURL(url);
      let q = 0.85, d = c.toDataURL('image/jpeg', q);
      while (d.length > 40000 && q > 0.45) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      if (d.length > 44000) {
        const c2 = document.createElement('canvas'); c2.width = 160; c2.height = 160;
        c2.getContext('2d').drawImage(c, 0, 0, 160, 160);
        d = c2.toDataURL('image/jpeg', 0.7);
      }
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No pudimos leer esa imagen. Prueba con una foto JPG o PNG.')); };
    img.src = url;
  });
}

function pintarFoto() {

function enlaceMapa() {

  a.classList.toggle('hidden', !href);

}

let GALP = []; // mis fotos de trabajos

function procesarTrabajo(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 720, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.8, d = c.toDataURL('image/jpeg', q);
      while (d.length > 170000 && q > 0.4) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      if (d.length > 175000) return rej(new Error('Esa foto es muy pesada. Prueba con otra.'));
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No pudimos leer esa imagen. Prueba con una foto JPG o PNG.')); };
    img.src = url;
  });
}

function pintarGaleria() {
  const g = $('#gal');
  if (!g) return;
  g.innerHTML = GALP.map(f => `<div class="item"><img src="${f.src}" alt=""><button class="borrar" data-borrar="${esc(f.id)}" aria-label="Borrar foto">×</button></div>`).join('');
  $('#gal-vacia').classList.toggle('hidden', GALP.length > 0);
  $('#gal-cuenta').textContent = '(' + GALP.length + ' de 6)';
  $('#gal-add').classList.toggle('hidden', GALP.length >= 6);
  g.querySelectorAll('[data-borrar]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Borrar esta foto?')) return;
    b.disabled = true;
    try {
      await api({ a: 'bBorrarFoto', token: S.token, id: b.dataset.borrar });
      GALP = GALP.filter(f => f.id !== b.dataset.borrar);
      pintarGaleria();
    } catch (e) { b.disabled = false; $('#gal-msg').className = 'err'; $('#gal-msg').textContent = e.message; }
  });
}

async function iniciarGaleria() {
  $('#gal-msg').className = 'muted'; $('#gal-msg').textContent = 'Cargando tus fotos…';
  try { GALP = (await api({ a: 'bGaleria', token: S.token })).fotos; $('#gal-msg').textContent = ''; }
  catch (e) { GALP = []; $('#gal-msg').className = 'err'; $('#gal-msg').textContent = e.message; }
  pintarGaleria();
  $('#gal-file').onchange = async e => {
    const files = Array.from(e.target.files).slice(0, Math.max(0, 6 - GALP.length));
    e.target.value = '';
    for (let i = 0; i < files.length; i++) {
      $('#gal-msg').className = 'muted'; $('#gal-msg').textContent = 'Subiendo foto ' + (i + 1) + ' de ' + files.length + '…';
      try {
        const d = await procesarTrabajo(files[i]);
        const r = await api({ a: 'bSubirFoto', token: S.token, datos: d });
        GALP.push({ id: r.id, src: d });
        pintarGaleria();
      } catch (err) { $('#gal-msg').className = 'err'; $('#gal-msg').textContent = err.message; return; }
    }
    $('#gal-msg').className = 'okmsg';
    $('#gal-msg').textContent = files.length ? 'Listo. Ya se ven en la web.' : 'Ya tienes 6 fotos. Borra una para subir otra.';
  };
}

      <p class="muted">${PF.cuentaGeneral ? 'Si la dejas vacía, el cliente paga a la cuenta de la barbería: ' + esc(PF.cuentaGeneral) + '.' : 'Si la dejas vacía, se usa la cuenta de la barbería (la pone el administrador).'}</p></div>
      <div id="an-msg" class="err"></div>
      <button class="btn sec" id="an-guardar">Guardar anticipo</button>
    </div>`;
  enlacesTop();
  pintarFoto(); enlaceMapa();
  $('#pf-dir').oninput = enlaceMapa; $('#pf-mapa').oninput = enlaceMapa;
  $('#pf-file').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    $('#pf-msg').className = 'muted'; $('#pf-msg').textContent = 'Procesando imagen…';
    try { fotoNueva = await procesarImagen(file); pintarFoto(); $('#pf-msg').textContent = 'Foto lista. Toca "Guardar perfil" para publicarla.'; }
    catch (err) { $('#pf-msg').className = 'err'; $('#pf-msg').textContent = err.message; }
    e.target.value = '';
  };
  $('#pf-quitar').onclick = () => { fotoNueva = ''; pintarFoto(); };
  const anTipo = () => {
    const t = $('#an-tipo').value;
    $('#an-v').classList.toggle('hidden', t === 'No'); $('#an-c').classList.toggle('hidden', t === 'No');
    $('#an-lbl').textContent = t === '%' ? '% del precio' : 'Valor';
    $('#an-valor').placeholder = t === '%' ? '30' : '10000';
  };
  $('#an-tipo').onchange = anTipo; anTipo();
  $('#an-guardar').onclick = async () => {
    const b = $('#an-guardar'); b.disabled = true; $('#an-msg').className = 'err'; $('#an-msg').textContent = '';
    try {
      const r = await api({ a: 'bGuardarAnticipo', token: S.token, anticipoTipo: $('#an-tipo').value, anticipoValor: $('#an-valor').value, cuenta: $('#an-cuenta').value });
      $('#an-msg').className = 'okmsg'; $('#an-msg').textContent = r.texto;
    } catch (e) { $('#an-msg').textContent = e.message; }
    b.disabled = false;
  };
  iniciarGaleria();
  $('#pf-guardar').onclick = async () => {
    const servicios = Array.from(document.querySelectorAll('.serv input:checked')).map(i => i.value);
    const b = $('#pf-guardar'); b.disabled = true; b.textContent = 'Guardando…';
    $('#pf-msg').className = 'err'; $('#pf-msg').textContent = '';
    try {
      const r = await api({ a: 'bGuardarPerfil', token: S.token, direccion: $('#pf-dir').value, mapa: $('#pf-mapa').value, servicios, foto: fotoNueva === undefined ? null : fotoNueva });
      if (fotoNueva !== undefined) PF.foto = fotoNueva;
      fotoNueva = undefined;
      $('#pf-msg').className = 'okmsg'; $('#pf-msg').textContent = r.texto;
    } catch (e) { $('#pf-msg').textContent = e.message; }
    b.disabled = false; b.textContent = 'Guardar perfil';
  };
}

if (S && S.token && S.hasta > Date.now()) cargarSemana(); else vistaLogin();
</script>
</body>
</html>
